[tool.poetry]
name = "cadms"
version = "0.1.0"
description = "AI Cyber-Defense Multi-Agent System"
authors = ["Antigravity"]

[tool.poetry.dependencies]
python = "^3.10"
langgraph = "^0.0.10"
langchain = "^0.1.0"
langchain-core = "^0.1.0"
langchain-openai = "^0.0.5" # Optional if using OpenAI models
pydantic = "^2.0.0"
fastapi = "^0.109.0"
uvicorn = "^0.27.0"
redis = "^5.0.1"
psycopg2-binary = "^2.9.9"
chromadb = "^0.4.22"
prometheus-client = "^0.19.0"
python-dotenv = "^1.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "^0.1.14"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
