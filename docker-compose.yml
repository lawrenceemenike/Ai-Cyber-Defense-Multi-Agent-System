version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: cadms-postgres
    environment:
      POSTGRES_USER: cadms_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: cadms_audit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: cadms-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  chromadb:
    image: chromadb/chroma:latest
    container_name: cadms-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
